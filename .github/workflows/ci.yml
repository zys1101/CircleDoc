# CircleDoc CI（PRD FR-409：「GitHub Actions：push 触发 lint + test + build」）。
#
# 三个 job 与 §6.4 的三条验收一一对应：
#   lint  → ruff + black 零告警，外加**密钥扫描**（FR-410：仓库无明文 AK）
#   test  → pytest 全绿（核心算法 285+ 条断言），**不需要真实 AK**（--mock 路径）
#   build → docker 镜像能构建，并断言**镜像里没有 .db**（FR-402：不得预置缓存库）
#
# 🔴 两条纪律：
#   1. **不对百度线上服务发任何请求**。CI 里没有 AK，也没有任何一条用例会碰真实网络；
#      限流与熔断的验证全部在本地 mock 网络层完成（条款 3.2.3(ii) 明文禁止压测）。
#   2. **零配置可跑**。test job 刻意不注入任何环境变量 —— 这本身就是 §6.2
#      「全新 clone、不填任何 .env 也能跑完一次体检」那条断言的持续验证。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消上一次未跑完的（省 runner 分钟，也让状态灯更快变绿）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint（ruff + black + 密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff（零告警）
        run: ruff check . --output-format=github

      - name: black（格式检查）
        run: black --check --diff .

      - name: 密钥扫描（FR-410：仓库不得出现明文 AK）
        # 只匹配「赋值形态」的 24 位以上串；`docs/` 与 `.env.example` 里是占位说明，排除。
        run: |
          set -euo pipefail
          if grep -rInE 'baidu_(server|browser)_ak[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{24,}' \
               --include='*.py' --include='*.js' --include='*.html' --include='*.yml' \
               --include='*.yaml' --include='*.json' --include='*.sh' --include='*.ps1' \
               --include='*.md' . \
               | grep -vE '^\./(\.env\.example|docs/|README\.md|tests/)'; then
            echo "::error::仓库里出现疑似明文百度 AK（FR-410）"
            exit 1
          fi
          echo "密钥扫描通过：未发现明文 AK"

      - name: 静态页零公网外链（R12 / R13）
        # 🔴 只查**资源标签**（`script` / `link` / `img` / `iframe` …）的引用，不查 `<a href>`。
        # 上一版用的是不分标签的 `grep '(src|href)="https?://'`，FR-413 页脚按条款 7.3 加的
        # 两个官方外链（隐私政策、服务条款）是 `<a>`，被这条 grep 判成「公网资源」而把 CI 跑红
        # （2026-10-11，test job 同批全绿）。`<a>` 是点击才走网络的文档链接，断网现场不会因为它白屏；
        # 会白屏的是下载期就取资源的标签 —— 那才是 R12 的对象。
        # 权威判定在 tests/test_web_smoke.py（标签感知 + 外链白名单 + rel 钉死），这里是不引用
        # 测试代码的第二双眼睛。
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          ASSET = {"script", "link", "img", "iframe", "source", "video", "audio", "embed", "object"}
          OPEN = re.compile(r"<(?P<tag>[a-zA-Z]+)\b(?P<attrs>[^>]*)>", re.I)
          ATTR = re.compile(r"""\b(?:src|href|srcset)=["'](?P<ref>[^"']+)["']""")
          EXTERNAL = re.compile(r"^(?:https?:)?//", re.I)

          bad = []
          for path in sorted(pathlib.Path("web").glob("*.html")):
              for tag in OPEN.finditer(path.read_text(encoding="utf-8")):
                  if tag["tag"].lower() not in ASSET:
                      continue
                  for attr in ATTR.finditer(tag["attrs"]):
                      if EXTERNAL.match(attr["ref"].strip()):
                          bad.append(f'{path.name}: <{tag["tag"]}> {attr["ref"]}')
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit("::error::静态页引用了公网资源（R12：Vue/ECharts/样式必须本地 vendored）")
          print("零公网外链检查通过（资源标签口径，合规 <a> 外链不计入）")
          PY

  test:
    name: test（pytest，零 AK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 词表自检（官方 POI 分类表逐词核对，FR-210）
        run: python -c "from services.poi_categories import assert_wordlist; assert_wordlist(); print('POI 词表自检通过')"

      - name: 合成样例基线校验（FR-412：三份基线齐全且与清单一致）
        run: python tools/gen_samples.py --check

      - name: pytest
        # ⚠️ 刻意不注入任何 AK / .env：零配置路径本身就是被测对象（§6.2）。
        run: pytest -q

      - name: 端到端冒烟（零配置起服务并跑完一次体检）
        # 这条跑的是真实的 ASGI 应用 + 真实的 mock 降级链，不是单元测试的桩。
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app

          client = TestClient(app)

          health = client.get("/api/health")
          assert health.status_code == 200, health.text
          body = health.json()
          # 无 AK 时必须落到 mock，并且**不是**红色报错（§6.2 零配置断言）。
          # ⚠️ 字段名要读准：顶层是 `data_mode`（本次生效的模式），
          # `data_mode_in_effect` 只存在于 `config` 子对象里 —— 按后者取顶层键会 KeyError。
          # 前端也是这么读的（`web/isochrone.js` 的 `config.data_mode_in_effect || health.data_mode`）。
          assert body["data_mode"] == "mock", body.get("data_mode")
          assert body["config"]["data_mode_in_effect"] == "mock", body["config"]
          # 零配置还必须挂出「为什么不是实时数据」的横幅，而不是静默降级。
          assert body["banner"]["show"] is True, body.get("banner")
          assert body["banner"]["level"] == "warning", body["banner"]
          assert body["baidu_reachable"] is False
          assert body["server_ak_type"] == "not_configured"
          print("ok  /api/health ->", body["data_mode"], "| banner:", body["banner"]["level"])

          samples = client.get("/api/samples").json()
          assert samples["ok"] and samples["count"] >= 3, samples
          print("ok  /api/samples ->", samples["count"], "个样例")

          report = client.post(
              "/api/analysis",
              json={"sample_id": samples["samples"][0]["id"], "minutes": 15, "data_mode": "mock"},
          )
          assert report.status_code == 200, report.text
          payload = report.json()
          assert payload["meta"]["data_source"] == "sample", payload["meta"]
          assert 0 <= payload["score"]["total"] <= 100, payload["score"]
          # 🔴 离线报告的硬要求：三栏计量必须如实为 0（合成不发出网请求）。
          usage = payload["usage"]
          assert usage["place_calls"] == 0 and usage["http_requests"] == 0, usage
          print("ok  /api/analysis ->", payload["score"]["total"], payload["score"]["grade"])

          # 三栏预算断言必须自洽（§6.1）
          assert payload["assertions"]["ok"] is True, payload["assertions"]
          print("ok  §6.1 三栏预算断言")
          PY

      - name: 上传失败时的诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          if-no-files-found: ignore
          path: |
            .pytest_cache/
            data/_harness/

  build:
    name: build（Docker 镜像 + 无 .db 断言）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t circledoc:ci .

      - name: 断言镜像里没有 .db（FR-402：不得预置缓存库）
        # 缓存被定位为「同进程运行时性能措施」，不是数据资产库；镜像里出现 .db
        # 说明开发机跑出来的缓存被打包分发了，那是条款 3.3.4 的禁止形态。
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh circledoc:ci -c \
            'find /app -name "*.db" -o -name "*.db-wal" -o -name "*.db-shm" | head -20')
          if [ -n "$found" ]; then
            echo "::error::镜像里出现了数据库文件（FR-402）："
            echo "$found"
            exit 1
          fi
          echo "镜像内无 .db 文件"

      - name: 断言镜像里没有真实 AK
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh circledoc:ci -c \
               'grep -rInE "baidu_(server|browser)_ak[[:space:]]*[:=][[:space:]]*[\"'"'"']?[A-Za-z0-9]{24,}" /app' ; then
            echo "::error::镜像里出现明文百度 AK（FR-410）"
            exit 1
          fi
          echo "镜像内无明文 AK"

      - name: 零配置起容器并跑一次体检（§6.2 零配置断言）
        # 容器里**不注入任何 .env 与 AK**：这条断言的现场条件就是「全新 clone、什么都没配」。
        run: |
          set -euo pipefail
          docker run -d --name circledoc-ci -p 8000:8000 circledoc:ci
          # 等健康检查转绿（Dockerfile 的 HEALTHCHECK 打 /api/health）。
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- /api/health ---"
          curl -fsS http://127.0.0.1:8000/api/health | head -c 600; echo
          echo "--- /api/samples ---"
          curl -fsS http://127.0.0.1:8000/api/samples | head -c 300; echo
          echo "--- POST /api/analysis（mock）---"
          curl -fsS -X POST http://127.0.0.1:8000/api/analysis \
            -H 'content-type: application/json' \
            -d '{"lnglat":"116.404,39.915","minutes":15,"data_mode":"mock"}' \
            | python -c "import json,sys; b=json.load(sys.stdin); print('score=', b['score']['total'], b['score']['grade'], '| source=', b['meta']['data_source'], '| blind=', b['blind_spots']['count'])"

      - name: 收集容器日志
        if: always()
        run: docker logs circledoc-ci || true

      - name: 清理
        if: always()
        run: docker rm -f circledoc-ci || true
