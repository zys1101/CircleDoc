# CircleDoc 预置样例社区清单（FR-102）—— 唯一出处
#
# 谁读这个文件：`services/samples.py:load_samples()` → `/api/samples`（前端下拉）
#              与 `tools/gen_samples.py`（合成数据集生成器）。
# 谁不读：业务逻辑。清单只描述「用哪个中心点、属于哪种建成形态」，不承载任何结论。
#
# ---------------------------------------------------------------------------------------
# ✅ 坐标已实调核验（2026-10-10，PRD §10-1 规程②已完成）
# ---------------------------------------------------------------------------------------
# 三条坐标都由 `python tools/gen_samples.py --verify` 走 **`/api/suggest`**
# （PRD §10-1 规程②指定的路径）取得，并用**逆地理编码交叉核对了行政区**：
#
#   id                     匹配到的候选      实测行政区 / 街道        坐标(BD09LL)
#   beijing-jiaodaokou     交道口街道        东城区 交道口街道        116.407282, 39.942233
#   beijing-tiantongyuan   天通苑            昌平区 天通苑北街道      116.431025, 40.076584
#   beijing-xiaojiahe      肖家河公园        海淀区 马连洼街道        116.302470, 40.024652
#
# ⚠️ 三条都标 `coord_verified: true`，含义是「工具核验过且行政区对得上」，不是「人工实地踏勘过」。
#    如要改动坐标，请重跑 `--verify` 而不是手改数字 —— 手改会让这个标记变成谎言。
#
# 🔴 一条值得留档的教训：**地理编码（geocode）拿不到社区级坐标，`/api/suggest` 才能。**
#    第一版 `--verify` 只走 geocode、且只要返回非空坐标就标 verified，实测跑出来是：
#
#      交道口街道  -> 东城区 / level=乡镇  ✅ 真的解析到了
#      天通苑      -> 东城区东华门街道     ❌ level=城市，坐标是市中心（市政府地址）
#      肖家河      -> 与「天通苑」**完全相同**的坐标  ❌ 同上
#
#    「天通苑」在昌平区，却被解析到东城区；「肖家河」拿到一个一模一样的坐标。
#    只检查「非空」会把这三条一起标成「已核验」。所以现在的规则是：
#    ① 优先走 `/api/suggest`（唯一能给出 POI 级精度的接口）；② geocode 只作兜底且
#    **拒绝 `level == "城市"`**；③ 最终坐标的行政区必须与下面的 `district` 一致，否则拒绝。
#
# ---------------------------------------------------------------------------------------
# 三个社区的选取标准（PRD FR-102）
# ---------------------------------------------------------------------------------------
# 同一座城市内**三种建成形态各一**，且圈内设施计数与盲区面积要有肉眼可辨的差异，
# 否则样例失去展示价值。差异由 `archetype` 指向的合成画像保证（services/poi_search.py）：
#
#   old_town          配套密集（药店/小学/市场都在）      → 盲区少、总分高
#   new_district      只有零星便利店与公交站              → 缺 1~2 类，命中 FR-224「配套不足」
#   transit_corridor  轨交枢纽但生活配套几乎为零          → 三类皆无，命中 FR-221「完全盲区」
#
# 第三个形态对应命题里的「城中村或老旧小区」：那类地方的特征正是「能上车、买不到菜」，
# 与 `transit_corridor` 画像一致，因此复用该画像而不是新造一个。
#
# ⚠️ 三个样例的坐标系一律 BD09LL（与全链路一致，见 docs/BAIDU_API_NOTES.md §6.1）。

city: 北京
coordinate_system: bd09ll
verified_at: '2026-10-10'
# `verified_at` 是 `--verify` 回填的核验日期。three 条全部核验完才会写。

communities:
  - id: beijing-jiaodaokou
    name: 交道口街道（成熟老城社区）
    city: 北京
    district: 东城区
    lnglat: [116.407282, 39.942233]
    form: 成熟老城社区
    archetype: old_town
    coord_verified: true
    note: >
      坐标已实调核验（suggest:交道口街道）：匹配到「交道口街道」，逆地理确认落在
      东城区 交道口街道（北京市东城区交道口街道雨儿胡同乙15号）。核验于 2026-10-10。

  - id: beijing-tiantongyuan
    name: 天通苑（新建大盘社区）
    city: 北京
    district: 昌平区
    lnglat: [116.431025, 40.076584]
    form: 新建大盘社区
    archetype: new_district
    coord_verified: true
    note: >
      坐标已实调核验（suggest:天通苑）：匹配到「天通苑」住宅区本身（同区候选里按
      精确同名优先，未取排在前面的「天通苑-地铁站」），逆地理确认落在
      昌平区 天通苑北街道（北京市昌平区天通苑北街道立水桥东二路）。核验于 2026-10-10。

  - id: beijing-xiaojiahe
    name: 肖家河（城中村 / 老旧小区）
    city: 北京
    district: 海淀区
    lnglat: [116.30247, 40.024652]
    form: 城中村 / 老旧小区
    archetype: transit_corridor
    coord_verified: true
    note: >
      坐标已实调核验（suggest:肖家河公园）：百度候选里没有与「肖家河」精确同名的条目，
      按「以关键字开头 + 名字最短」选到肖家河公园，逆地理确认落在
      海淀区 马连洼街道（北京市海淀区马连洼街道林萌街）。核验于 2026-10-10。
